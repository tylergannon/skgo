name: CI

# Pull requests get the comparatively fast structural checks. Browser-level
# product qualification belongs to release.yml after a commit reaches
# main, where a ten-minute run does not block review iteration.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, tests, and Conventional Commit
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum
            example/go.sum

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: extractions/setup-just@v4

      # Push CI is the same-repository PR gate, so HEAD is the commit whose
      # subject will drive an eventual release. Squash PR titles must follow
      # the same form or the resulting main commit immediately goes red.
      - name: HEAD uses a Conventional Commit subject
        run: go run ./cmd/skgo-release-version --check HEAD

      - name: Install build dependencies
        run: just install

      - name: Build
        run: just build

      - name: Vet
        run: just vet

      # Includes the existing external scaffold build against candidate Go and
      # npm artifacts, but not the release-only tagged browser test.
      - name: Unit and focused integration tests
        run: just test
