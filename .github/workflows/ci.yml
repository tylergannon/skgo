name: CI

# One ordinary check per development revision. Release qualification owns main;
# reserved release tags do not launch another copy of development CI.
on:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Go contracts and Conventional Commit
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 20
    outputs:
      native: ${{ steps.changes.outputs.native }}
      production: ${{ steps.changes.outputs.production }}
      development: ${{ steps.changes.outputs.development }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache: false
          cache-dependency-path: |
            go.sum
            go.work.sum
            example/go.sum
      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true
          # Self-hosted runners keep their tools. Restoring the cache there
          # downloads hundreds of megabytes they already have.
          cache: false
      - uses: extractions/setup-just@v4
      - name: HEAD uses a Conventional Commit subject
        run: go run ./cmd/skgo-release-version --check HEAD
      - name: Select qualification from changed inputs
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Qualify all changes in the candidate, even when a later docs-only
          # push cancels an earlier run that had not finished qualification.
          base=$(git merge-base HEAD "${PR_BASE:-origin/main}")
          paths=$(git diff --name-only "$base" HEAD)
          for kind in native production development; do
            case "$kind" in
              native) pattern='^([^/]+\.go$|internal/(gen|hotreload|pluginbuild|plugininstall|templates|toolchain)/|cmd/skgo/|templateapi/|go\.(mod|sum|work)|example/(go\.|mise|web/(package|pnpm|vite))|\.github/workflows/|Justfile)' ;;
              production) pattern='(\.go$|^internal/(adapter|sv|kitpatch|gen)/|^example/|^go\.|^\.github/workflows/|^Justfile)' ;;
              development) pattern='^([^/]+\.go$|internal/(devserver|adapter|gen|hotreload|kitpatch|toolchain)/|cmd/skgo/|example/(go\.|mise|web/)|go\.|\.github/workflows/|Justfile)' ;;
            esac
            if printf '%s\n' "$paths" | grep -Eq "$pattern"; then
              echo "$kind=true" >> "$GITHUB_OUTPUT"
            else
              echo "$kind=false" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Install pinned frontend tools
        run: cd example/web && vp install --frozen-lockfile
      - name: Vet
        run: just vet
      - name: Routine Go contracts (normal test cache)
        run: just test

  qualification:
    name: Relevant compiler and application qualification
    needs: checks
    if: needs.checks.outputs.native == 'true' || needs.checks.outputs.production == 'true' || needs.checks.outputs.development == 'true'
    uses: ./.github/workflows/qualification.yml
    with:
      native: ${{ needs.checks.outputs.native == 'true' }}
      production: ${{ needs.checks.outputs.production == 'true' }}
      development: ${{ needs.checks.outputs.development == 'true' }}

  # svelte-check over the example app, only when something under example/web
  # changed. It is where the Svelte and TypeScript files the documentation
  # references are type-checked; the production qualification job also runs
  # it after building the example.
  svelte-check:
    name: Svelte type check of example/web
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did example/web change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          if git diff --name-only "$BASE" HEAD -- example/web | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change under example/web since $BASE."
          fi

      - uses: jdx/mise-action@v4
        if: steps.changed.outputs.run == 'true'
        with:
          working_directory: example
          export_path: false
          cache: false

      - if: steps.changed.outputs.run == 'true'
        run: mise -C example/web exec -- vp install --frozen-lockfile

      - if: steps.changed.outputs.run == 'true'
        run: mise -C example/web exec -- vp run check
