name: Native plugin tests

# A nested Go module is deliberately outside core's ./... and release gates.
# It still runs its own contracts on every relevant development revision.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
    paths:
      - 'plugins/native-shell/**'
      - 'templateapi/**'
      - '*.go'
      - 'generate/**'
      - 'internal/gen/**'
      - 'internal/ssr/**'
      - 'internal/adapter/**'
      - 'internal/remotearg/**'
      - 'internal/formdata/**'
      - 'internal/kithash/**'
      - 'internal/envspec/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-plugin-tests.yml'
  pull_request:
    paths:
      - 'plugins/native-shell/**'
      - 'templateapi/**'
      - '*.go'
      - 'generate/**'
      - 'internal/gen/**'
      - 'internal/ssr/**'
      - 'internal/adapter/**'
      - 'internal/remotearg/**'
      - 'internal/formdata/**'
      - 'internal/kithash/**'
      - 'internal/envspec/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-plugin-tests.yml'

concurrency:
  group: native-plugin-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
          cache-dependency-path: |
            go.sum
            plugins/native-shell/go.sum
      - name: Native plugin Go contracts
        working-directory: plugins/native-shell
        run: go test ./...

  compiler-and-wire:
    name: Native compiler and wire witnesses
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-26' || 'skgo-managed-macos' }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
          cache-dependency-path: |
            go.sum
            plugins/native-shell/go.sum
      - uses: jdx/mise-action@v4
        with:
          working_directory: plugins/native-shell/sdk
          export_path: true
          cache: false
      - name: Generated Swift and SDK wire regression tests
        working-directory: plugins/native-shell
        run: go test -tags skgo_qualification -count=1 ./...
      - name: Zig SDK unit tests and Swift link library
        working-directory: plugins/native-shell/sdk/core
        run: mise exec -- zig build -j4 test library
      - name: Swift SDK unit tests
        working-directory: plugins/native-shell/sdk/swift
        run: |
          args=(--jobs 4)
          # CLT's Swift build engine omits its shipped Testing macro plug-in.
          plugin="$(dirname "$(dirname "$(xcrun --find swiftc)")")/lib/swift/host/plugins/testing/libTestingMacros.dylib"
          if [[ -f "$plugin" ]]; then args+=(-Xswiftc -load-plugin-library -Xswiftc "$plugin"); fi
          swift test "${args[@]}"
