name: Release gate

# npm's trusted publisher is bound to this workflow path. Keep qualification,
# publication, and tagging in this top-level workflow so its OIDC identity is
# the one the registry authorizes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualification:
    name: Fresh-application qualification
    uses: ./.github/workflows/qualification.yml

  version:
    name: Choose the qualified version
    needs: qualification
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Derive the release from Conventional Commits
        id: version
        run: |
          version=$(go run ./cmd/skgo-release-version)
          if [ "$version" = "none" ]; then
            echo "No feat, fix, perf, revert, or breaking commit since the last release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish @skgo/sveltekit-adapter
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance: the attestation is signed with this release.yml
      # workflow's OIDC token, matching the package's trusted publisher.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      # The adapter identity tests pack the exact package that will be
      # published. They refuse to skip when pnpm is absent, so the release
      # runner needs the same pinned package manager as the browser suite.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      # The adapter the app installs and the adapter the Go binary embeds are
      # the same files, and every build is refused at startup if they are not.
      # These tests are what checks that the tarball leaving here really holds
      # them — a `files` list that forgot a runtime module publishes an adapter
      # that names itself something no skgo will accept.
      - name: The tarball is the adapter this module embeds
        run: go test ./internal/adapter/

      # A release whose package is byte-for-byte the newest one on the registry
      # publishes nothing: skgo pairs with the newest adapter at or below its
      # own version, which is that one. The Go tag is still cut below.
      - name: Is the package any different from the published one?
        id: changed
        run: |
          result=$(go run ./cmd/skgo-adapter-changed)
          case "$result" in
            changed) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            unchanged) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "skgo-adapter-changed answered '$result'"; exit 1 ;;
          esac

      # The tag is the version. Writing it into package.json here rather than
      # committing it means the tree never carries a version that is a promise
      # about a release nobody has cut.
      - name: Stamp the tag's version
        if: steps.changed.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -stamp "$RELEASE_VERSION"
          echo "publishing @skgo/sveltekit-adapter@${RELEASE_VERSION#v}"

      # npm binds this direct publish to the repository, this release.yml file,
      # and this GitHub-hosted runner through the trusted publisher configured
      # on the package. No static npm or Doppler credential reaches the runner.
      - name: npm publish
        if: steps.changed.outputs.publish == 'true'
        working-directory: internal/adapter
        run: npm publish --access public

  tag:
    name: Tag the published, qualified commit
    needs: [version, npm]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the exact qualified SHA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" "$GITHUB_SHA" -m "$VERSION"
          git push origin "$VERSION"
