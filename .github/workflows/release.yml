name: Release

# A `v*` tag is the release. Go needs nothing published — `go get` fetches the
# tag — so this workflow exists for the half that npm cannot infer: it stamps
# sveltekit-adapter-skgo with the tag's version and uploads it.
#
# The tag is the gesture and the only gesture. Nothing here decides whether the
# release is good; whether skgo works is a screenshot of the running app, looked
# at, and that happens before anybody types `just release`.
on:
  push:
    tags:
      - 'v*'
  # Temporary bootstrap escape hatch. It can publish only the failed v0.2.6
  # tag, and is removed once that package is verified in the registry.
  workflow_dispatch:
    inputs:
      tag:
        description: "The failed release tag to recover (v0.2.6 only)"
        required: true
        type: string

permissions:
  contents: read
  # npm provenance: the attestation is signed with the workflow's own OIDC
  # token, which is what lets the registry say this tarball came from this tag
  # of this repository rather than from somebody's laptop.
  id-token: write

jobs:
  npm:
    name: Publish sveltekit-adapter-skgo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      # The adapter identity tests pack the exact package that will be
      # published. They refuse to skip when pnpm is absent, so the release
      # runner needs the same pinned package manager as the browser suite.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      # The adapter the app installs and the adapter the Go binary embeds are
      # the same files, and every build is refused at startup if they are not.
      # These tests are what checks that the tarball leaving here really holds
      # them — a `files` list that forgot a runtime module publishes an adapter
      # that names itself something no skgo will accept.
      - name: The tarball is the adapter this module embeds
        run: go test ./internal/adapter/

      # The tag is the version. Writing it into package.json here rather than
      # committing it means the tree never carries a version that is a promise
      # about a release nobody has cut.
      - name: Stamp the tag's version
        working-directory: internal/adapter
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RECOVERY_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$RECOVERY_PUBLISH" = true ] && [ "$RELEASE_TAG" != v0.2.6 ]; then
            echo "the temporary recovery trigger accepts only v0.2.6" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          npm pkg set version="$version"
          echo "publishing sveltekit-adapter-skgo@$version"

      # The adapter and Go module are released together. A tag is not a complete
      # release until this exact adapter version reaches npm. The bootstrap npm
      # token lives only in Doppler and reaches this one command through its
      # read-only service token; a later release switches this to npm trusted
      # publishing and removes both long-lived credentials.
      - uses: dopplerhq/cli-action@v3

      - name: npm publish
        working-directory: internal/adapter
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          NPM_OTP: ${{ secrets.NPM_OTP }}
        run: |
          if [ -n "$NPM_OTP" ]; then
            doppler run -- sh -c 'NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --provenance --otp="$NPM_OTP"'
          else
            doppler run -- sh -c 'NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --provenance'
          fi
