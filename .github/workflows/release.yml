name: Release

# Called only after release-gate.yml qualifies and tags an exact main SHA. Go
# needs nothing else published; this workflow stamps the npm half of that same
# release and uploads it with trusted provenance.
on:
  workflow_call:
    inputs:
      version:
        description: The already-created v-prefixed release tag
        required: true
        type: string

permissions:
  contents: read
  # npm provenance: the attestation is signed with the workflow's own OIDC
  # token, which is what lets the registry say this tarball came from this tag
  # of this repository rather than from somebody's laptop.
  id-token: write

jobs:
  npm:
    name: Publish @skgo/sveltekit-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      # The adapter identity tests pack the exact package that will be
      # published. They refuse to skip when pnpm is absent, so the release
      # runner needs the same pinned package manager as the browser suite.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      # The adapter the app installs and the adapter the Go binary embeds are
      # the same files, and every build is refused at startup if they are not.
      # These tests are what checks that the tarball leaving here really holds
      # them — a `files` list that forgot a runtime module publishes an adapter
      # that names itself something no skgo will accept.
      - name: The tarball is the adapter this module embeds
        run: go test ./internal/adapter/

      # The tag is the version. Writing it into package.json here rather than
      # committing it means the tree never carries a version that is a promise
      # about a release nobody has cut.
      - name: Stamp the tag's version
        working-directory: internal/adapter
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          npm pkg set version="$version"
          sed -i "s/<matching-skgo-version>/$version/g" README.md
          echo "publishing @skgo/sveltekit-adapter@$version"

      # npm binds this direct publish to the repository, this release.yml file,
      # and this GitHub-hosted runner through the trusted publisher configured
      # on the package. No static npm or Doppler credential reaches the runner.
      - name: npm publish
        working-directory: internal/adapter
        run: npm publish --access public
