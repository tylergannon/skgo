name: Release

# npm's trusted publisher is bound to this workflow path. Keep qualification,
# publication, and tagging in this top-level workflow so its OIDC identity is
# the one the registry authorizes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualification:
    name: Example qualification
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/qualification.yml

  version:
    name: Reserve the candidate version
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, skgo-release]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false

      - name: Derive the release from Conventional Commits
        id: version
        run: |
          version=$(git tag --points-at HEAD | sort -V | tail -1)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version=$(go run ./cmd/skgo-release-version)
          fi
          if [ "$version" = "none" ]; then
            echo "No feat, fix, perf, revert, docs, or breaking commit since the last release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Candidate tags are reserved before qualification, as in Gimbal. All
      # publication waits for the gates below. GITHUB_TOKEN can create this
      # tag because builds are jobs in this workflow, not a tag-push workflow.
      - name: Reserve the exact source tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git rev-parse "$VERSION^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$GITHUB_SHA"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$VERSION" "$GITHUB_SHA" -m "$VERSION"
            git push origin "$VERSION"
          fi

  linux-cli:
    name: CLI (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, Linux, X64, skgo-release]
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and package the versioned CLI
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: go run ./cmd/skgo-release build "$VERSION" "$GITHUB_SHA"
      - name: Exercise the packaged CLI and an external Go plugin
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: SKGO_RELEASE_ARCHIVE="$PWD/dist/skgo_${RELEASE_VERSION#v}_linux_${{ matrix.arch }}.tar.gz" go test -tags release ./cmd/skgo-release -run '^TestPackagedCLI$' -count=1 -v
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  macos-cli:
    name: Signed and notarized macOS CLI
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: [self-hosted, macOS, ARM64, skgo-release]
    environment: release
    timeout-minutes: 40
    env:
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Fetch signing credentials from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = skgo && test "$CONFIG" = stg
      - name: Prepare temporary signing keychain
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ steps.doppler.outputs.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.doppler.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: go run ./cmd/skgo-release signing setup
      - name: Build, sign and notarize the CLI
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: nice -n 10 go run ./cmd/skgo-release build "$VERSION" "$GITHUB_SHA"
      - name: Exercise the signed archive and an external Go plugin
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: SKGO_RELEASE_ARCHIVE="$PWD/dist/skgo_${RELEASE_VERSION#v}_darwin_arm64.tar.gz" go test -tags release ./cmd/skgo-release -run '^TestPackagedCLI$' -count=1 -v
      - uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Remove signing credentials
        if: always()
        run: go run ./cmd/skgo-release signing cleanup

  adapter-npm:
    name: Publish @skgo/sveltekit-adapter
    needs: [version, qualification, linux-cli, macos-cli]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    permissions:
      contents: read
      # npm provenance: the attestation is signed with this release.yml
      # workflow's OIDC token, matching the package's trusted publisher.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org

      # The qualification dependency already ran the full adapter package,
      # including tarball checks and Kit's live graph, against the built example
      # at this exact SHA. Publication consumes that result; it needs no second
      # frontend installation or integration-test run. Package comparison and
      # stamping below are standalone Go commands.

      # A release whose package is byte-for-byte the newest one on the registry
      # publishes nothing: skgo pairs with the newest adapter at or below its
      # own version, which is that one. The Go tag is still cut below.
      - name: Is the package any different from the published one?
        id: changed
        run: |
          result=$(go run ./cmd/skgo-adapter-changed)
          case "$result" in
            changed) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            unchanged) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "skgo-adapter-changed answered '$result'"; exit 1 ;;
          esac

      # The tag is the version. Writing it into package.json here rather than
      # committing it means the tree never carries a version that is a promise
      # about a release nobody has cut.
      - name: Stamp the tag's version
        if: steps.changed.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -stamp "$RELEASE_VERSION"
          echo "publishing @skgo/sveltekit-adapter@${RELEASE_VERSION#v}"

      # npm binds this direct publish to the repository, this release.yml file,
      # and this GitHub-hosted runner through the trusted publisher configured
      # on the package. No static npm or Doppler credential reaches the runner.
      - name: npm publish
        if: steps.changed.outputs.publish == 'true'
        working-directory: internal/adapter
        run: npm publish --access public

  sv-npm:
    name: Publish @skgo/sv
    needs: [version, qualification, linux-cli, macos-cli]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true

      - name: Install the add-on's build-only dependencies
        working-directory: internal/sv
        run: vp install --frozen-lockfile

      - name: Build and verify the published add-on
        working-directory: internal/sv
        run: vp run build

      - name: The tarball is the self-contained native add-on
        run: go test ./internal/sv/

      # Both sparse npm packages use the Go release version whenever they
      # change. `skgo new` can therefore select each independently as the
      # newest exact version not newer than its own module version.
      - name: Is the package any different from the published one?
        id: changed
        run: |
          result=$(go run ./cmd/skgo-adapter-changed -dir internal/sv -package @skgo/sv -require-published)
          case "$result" in
            changed) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            unchanged) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "skgo-adapter-changed answered '$result'"; exit 1 ;;
          esac

      - name: Stamp the tag's version
        if: steps.changed.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -dir internal/sv -package @skgo/sv -stamp "$RELEASE_VERSION"
          echo "publishing @skgo/sv@${RELEASE_VERSION#v}"

      - name: npm publish
        if: steps.changed.outputs.publish == 'true'
        # npm validates devEngines for its working directory. Keep VP
        # responsible for the add-on build; publish its package from the root.
        run: npm publish ./internal/sv --access public

  publish:
    name: Publish GitHub Release and Homebrew cask
    needs: [version, qualification, linux-cli, macos-cli, adapter-npm, sv-npm]
    if: needs.version.outputs.version != ''
    runs-on: [self-hosted, Linux, X64, skgo-release]
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Verify all archives and calculate final checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: go run ./cmd/skgo-release checksums dist "$VERSION"
      - name: Publish the qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" --clobber dist/*.tar.gz dist/checksums.txt
            gh release edit "$VERSION" --draft=false --latest --title "SKGO $VERSION"
          else
            gh release create "$VERSION" --verify-tag --latest --title "SKGO $VERSION" --generate-notes dist/*.tar.gz dist/checksums.txt
          fi
      - name: Fetch Homebrew publisher from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = skgo && test "$CONFIG" = stg
      - uses: actions/checkout@v7
        with:
          repository: tylergannon/homebrew-skgo
          ref: main
          path: homebrew-tap
          ssh-key: ${{ steps.doppler.outputs.TAP_DEPLOY_KEY }}
      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: go run ./cmd/skgo-release tap homebrew-tap "$VERSION"
