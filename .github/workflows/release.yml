name: Release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualification:
    name: Generated app and HMR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ORIGIN: http://127.0.0.1:8080
      SKGO_PORT: "8080"
      SKGO_DEV_PORT: "5173"
      SKGO_LOG: ${{ github.workspace }}/example/e2e/server.log
      SKGO_QUALIFICATION_ARTIFACTS: ${{ github.workspace }}/qualification-artifacts

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum
            example/go.sum

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: extractions/setup-just@v4

      - name: Install and build
        run: |
          just install
          cd example/e2e
          pnpm exec playwright install --with-deps chromium
          cd ../..
          just build
          just vet
          just test

      - name: Fresh generated app works in production and development
        run: go test -tags=qualification -count=1 -timeout=30m -v ./internal/newapp -run '^TestGeneratedProjectBrowserContract$'

      - name: Example keeps HMR
        run: |
          just dev &
          for _ in $(seq 120); do
            curl -sf -o /dev/null "http://127.0.0.1:$SKGO_DEV_PORT/__skgo_dev/info" && break
            sleep 1
          done
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$ORIGIN/" && break
            sleep 1
          done
          test "$(curl -sI "$ORIGIN/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-skgo-mode"{print $2}')" = dev
          cd example/e2e
          BASE_URL="$ORIGIN" SKGO_EXPECTED_MODE=dev SKGO_E2E_RUN=release mise x -- pnpm run test:release

      - name: Stop servers
        if: always()
        run: |
          pids=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          [ -n "$pids" ] && kill $pids 2>/dev/null || true

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            qualification-artifacts
            example/e2e/screenshots
            example/e2e/playwright-report
            example/e2e/test-results
            ephemeral/screenshots

  version:
    name: Choose version
    needs: qualification
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Derive version from Conventional Commits
        id: version
        run: |
          current=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          version=$(go run github.com/caarlos0/svu/v3@v3.4.1 next)
          [ "$version" != "$current" ] || version=
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish @skgo/sveltekit-adapter
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: go test ./internal/adapter/
      - name: Stamp version
        working-directory: internal/adapter
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          npm pkg set version="$version"
          sed -i "s/<matching-skgo-version>/$version/g" README.md
      - name: Publish
        working-directory: internal/adapter
        run: npm publish --access public

  tag:
    name: Tag qualified commit
    needs: [version, npm]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag exact SHA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" "$GITHUB_SHA" -m "$VERSION"
          git push origin "$VERSION"
