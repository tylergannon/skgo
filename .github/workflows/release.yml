name: Release

# A version tag starts publication. Re-run this workflow for the same
# tag to finish a failed release. Keep this path for npm's trusted publisher.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish again
        required: true
      publish:
        description: Publish packages and releases after building (disable to qualify runner changes)
        type: boolean
        default: true

concurrency:
  group: core-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  source:
    name: Read the version tag
    runs-on: skgo-managed-linux
    outputs:
      version: ${{ steps.tag.outputs.version }}
      candidate: ${{ steps.tag.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Read the tagged source
        id: tag
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate=$(git rev-parse "$VERSION^{commit}")
          test "$(git rev-parse HEAD)" = "$candidate"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

  linux-cli:
    name: CLI (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: skgo-managed-linux
          - arch: arm64
            runner: skgo-managed-linux-arm64
    runs-on: ${{ matrix.runner }}
    # ARM64 runs under QEMU on Bob; its Go compiler and plugin test execute
    # there as ARM64 programs rather than dropping the packaged-CLI witness.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build and package the versioned CLI
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: go run ./cmd/skgo-release build "$VERSION" "${{ needs.source.outputs.candidate }}"
      - name: Exercise the packaged CLI and an external Go plugin
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: SKGO_RELEASE_ARCHIVE="$PWD/dist/skgo_${RELEASE_VERSION#v}_linux_${{ matrix.arch }}.tar.gz" go test -tags release ./cmd/skgo-release -run '^TestPackagedCLI$' -count=1 -v
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  macos-cli:
    name: Signed and notarized macOS CLI
    needs: source
    runs-on: skgo-managed-macos
    environment: release
    timeout-minutes: 40
    env:
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@v7
        with:
          # The helper comes from this workflow revision. Its build command
          # still verifies the released module against the exact candidate SHA.
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Fetch signing credentials from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = skgo && test "$CONFIG" = stg
      - name: Prepare temporary signing keychain
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ steps.doppler.outputs.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.doppler.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: go run ./cmd/skgo-release signing setup
      - name: Build, sign and notarize the CLI
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: nice -n 10 go run ./cmd/skgo-release build "$VERSION" "${{ needs.source.outputs.candidate }}"
      - name: Exercise the signed archive and an external Go plugin
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: SKGO_RELEASE_ARCHIVE="$PWD/dist/skgo_${RELEASE_VERSION#v}_darwin_arm64.tar.gz" go test -tags release ./cmd/skgo-release -run '^TestPackagedCLI$' -count=1 -v
      - uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Remove signing credentials
        if: always()
        run: go run ./cmd/skgo-release signing cleanup

  adapter-package:
    name: Prepare @skgo/sveltekit-adapter on Bob
    needs: source
    runs-on: skgo-managed-linux
    timeout-minutes: 25
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - &setup_vp
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: example/web
          run-install: false
          node-manager: false
          package-manager: true
      - name: Stamp and pack the tagged adapter
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -stamp "$VERSION"
          mkdir -p npm-package
          cd example/web
          vp pm pack --pack-destination "$GITHUB_WORKSPACE/npm-package" -- --dir "$GITHUB_WORKSPACE/internal/adapter"
      - uses: actions/upload-artifact@v7
        with:
          name: adapter-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 2

  adapter-npm:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    name: Publish @skgo/sveltekit-adapter
    needs: [source, linux-cli, macos-cli, adapter-package]
    # npm trusted publishing accepts GitHub-hosted runners only. Publish the
    # exact tarball Bob prepared, without rebuilding or installing dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - *setup_vp
      - uses: actions/download-artifact@v8
        with:
          name: adapter-package
          path: npm-package
      - &publish_npm
        name: Publish the tagged package or reuse its existing bytes
        working-directory: example/web
        run: |
          tarball=$(find "$GITHUB_WORKSPACE/npm-package" -name '*.tgz' -print -quit)
          package=$(tar -xOf "$tarball" package/package.json | jq -r .name)
          version=$(tar -xOf "$tarball" package/package.json | jq -r .version)
          TARBALL="$tarball" PACKAGE="$package" VERSION="$version" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import {setTimeout as sleep} from 'node:timers/promises';
          const {TARBALL,PACKAGE,VERSION}=process.env;
          const integrity='sha512-'+createHash('sha512').update(readFileSync(TARBALL)).digest('base64');
          async function published(){
            const response=await fetch(`https://registry.npmjs.org/${encodeURIComponent(PACKAGE)}/${VERSION}`);
            if(response.status===404)return null;
            if(!response.ok)throw new Error(`Registry returned ${response.status}`);
            return (await response.json()).dist.integrity;
          }
          function same(existing){
            if(existing!==integrity)throw new Error('Published package differs from this tagged package');
            console.log(`${PACKAGE}@${VERSION} is already published`);
          }
          async function staged(){
            for(const started=Date.now();;await sleep(10_000)){
              const existing=await published();
              if(existing!==null)return existing;
              if(Date.now()-started>15*60_000)throw new Error(`npm has not served ${PACKAGE}@${VERSION} after 15 minutes`);
              console.log(`Waiting for npm to serve the staged ${PACKAGE}@${VERSION}`);
            }
          }
          const existing=await published();
          if(existing!==null)same(existing);
          else {
            const publish=spawnSync('vp',['pm','publish',TARBALL,'--access','public','--no-git-checks'],{encoding:'utf8',stdio:['inherit','pipe','pipe']});
            if(publish.error)throw publish.error;
            process.stdout.write(publish.stdout);process.stderr.write(publish.stderr);
            // npm stages a new version for minutes before the registry serves it
            // and answers 409 to another publish meanwhile, so a rerun in that
            // window waits for the staged bytes instead.
            if(publish.status!==0){
              if(!/409 Conflict|E409/.test(publish.stdout+publish.stderr))throw new Error(`vp pm publish exited ${publish.status}`);
              same(await staged());
            }
          }
          NODE

  sv-package:
    name: Prepare @skgo/sv on Bob
    needs: source
    runs-on: skgo-managed-linux
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true
          # Bob keeps its tools; a cache restore would download them again.
          cache: false
      - name: Install the add-on's build-only dependencies
        working-directory: internal/sv
        run: vp install --frozen-lockfile
      - name: Build the add-on once
        working-directory: internal/sv
        run: vp run build
      - name: Check the self-contained add-on
        run: go test ./internal/sv/
      - name: Stamp and pack the tagged add-on
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -dir internal/sv -package @skgo/sv -stamp "$RELEASE_VERSION"
          mkdir -p "$RUNNER_TEMP/sv-package"
          cd example/web
          vp pm pack --pack-destination "$RUNNER_TEMP/sv-package" -- --dir "$GITHUB_WORKSPACE/internal/sv"
      - uses: actions/upload-artifact@v7
        with:
          name: sv-package
          path: ${{ runner.temp }}/sv-package/*.tgz
          if-no-files-found: error
          retention-days: 2

  sv-npm:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    name: Publish @skgo/sv
    needs: [source, linux-cli, macos-cli, sv-package]
    # npm trusted publishing accepts GitHub-hosted runners only. Consume
    # Bob's exact stamped tarball; no build or dependency install happens here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - *setup_vp
      - uses: actions/download-artifact@v8
        with:
          name: sv-package
          path: npm-package
      - *publish_npm


  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    name: Publish GitHub Release and Homebrew cask
    needs: [source, linux-cli, macos-cli, adapter-npm, sv-package, sv-npm]
    runs-on: skgo-managed-linux
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Reuse CLI archives already published for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
            for archive in dist/*.tar.gz; do
              if grep -Fxq "${archive##*/}" <<< "$existing"; then
                gh release download "$VERSION" --pattern "${archive##*/}" --dir dist --clobber
              fi
            done
          fi
      - name: Verify all archives and calculate final checksums
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: go run ./cmd/skgo-release checksums dist "$VERSION"
      - name: Publish the qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
            for archive in dist/*.tar.gz; do
              if ! grep -Fxq "${archive##*/}" <<< "$existing"; then gh release upload "$VERSION" "$archive"; fi
            done
            gh release upload "$VERSION" --clobber dist/checksums.txt
          else
            gh release create "$VERSION" --verify-tag --latest --title "SKGO $VERSION" --generate-notes dist/*.tar.gz dist/checksums.txt
          fi
      - name: Fetch Homebrew publisher from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = skgo && test "$CONFIG" = stg
      - uses: actions/checkout@v7
        with:
          repository: tylergannon/homebrew-skgo
          ref: main
          path: homebrew-tap
          ssh-key: ${{ steps.doppler.outputs.TAP_DEPLOY_KEY }}
      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' homebrew-tap/Casks/skgo.rb)
          if test "$(printf '%s\n' "$current" "${VERSION#v}" | sort -V | tail -1)" != "${VERSION#v}"; then
            echo "Homebrew already points at newer version $current."
            exit 0
          fi
          go run ./cmd/skgo-release tap homebrew-tap "$VERSION"
