name: Release

# A qualified version tag starts publication. Re-run this workflow for the same
# tag to finish a failed release. Keep this path for npm's trusted publisher.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified version tag to publish again
        required: true

concurrency:
  group: core-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  source:
    name: Read the version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      candidate: ${{ steps.tag.outputs.candidate }}
      attempt: ${{ steps.tag.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Read the tagged source and qualification
        id: tag
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate=$(git rev-parse "$VERSION^{commit}")
          test "$(git rev-parse HEAD)" = "$candidate"
          git merge-base --is-ancestor HEAD origin/main
          attempt=$(git for-each-ref --format='%(contents)' "refs/tags/$VERSION" | sed -n 's/^Qualification: //p')
          [[ "$attempt" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

  linux-cli:
    name: CLI (${{ matrix.arch }})
    needs: source
    if: needs.source.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, Linux, X64, skgo-release]
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and package the versioned CLI
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: go run ./cmd/skgo-release build "$VERSION" "${{ needs.source.outputs.candidate }}"
      - name: Exercise the packaged CLI and an external Go plugin
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: SKGO_RELEASE_ARCHIVE="$PWD/dist/skgo_${RELEASE_VERSION#v}_linux_${{ matrix.arch }}.tar.gz" go test -tags release ./cmd/skgo-release -run '^TestPackagedCLI$' -count=1 -v
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  macos-cli:
    name: Signed and notarized macOS CLI
    needs: source
    if: needs.source.outputs.version != ''
    runs-on: [self-hosted, macOS, ARM64, skgo-release]
    environment: release
    timeout-minutes: 40
    env:
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Fetch signing credentials from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = skgo && test "$CONFIG" = stg
      - name: Prepare temporary signing keychain
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ steps.doppler.outputs.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.doppler.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: go run ./cmd/skgo-release signing setup
      - name: Build, sign and notarize the CLI
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: nice -n 10 go run ./cmd/skgo-release build "$VERSION" "${{ needs.source.outputs.candidate }}"
      - name: Exercise the signed archive and an external Go plugin
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: SKGO_RELEASE_ARCHIVE="$PWD/dist/skgo_${RELEASE_VERSION#v}_darwin_arm64.tar.gz" go test -tags release ./cmd/skgo-release -run '^TestPackagedCLI$' -count=1 -v
      - uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Remove signing credentials
        if: always()
        run: go run ./cmd/skgo-release signing cleanup

  adapter-npm:
    name: Publish @skgo/sveltekit-adapter
    needs: [source, linux-cli, macos-cli]
    if: needs.source.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    permissions:
      contents: read
      # npm provenance: the attestation is signed with this release.yml
      # workflow's OIDC token, matching the package's trusted publisher.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org

      # Independent qualification exercised the matching candidate adapter
      # at this SHA. Package comparison and stamping are standalone Go commands;
      # publication needs no second frontend installation or test run.

      # A release whose package is byte-for-byte the newest one on the registry
      # publishes nothing: skgo pairs with the newest adapter at or below its
      # own version, which is that one. The CLI still ships for this tag.
      - name: Is the package any different from the published one?
        id: changed
        run: |
          result=$(go run ./cmd/skgo-adapter-changed)
          case "$result" in
            changed) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            unchanged) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "skgo-adapter-changed answered '$result'"; exit 1 ;;
          esac

      # The tag is the version. Writing it into package.json here rather than
      # committing it means the tree never carries a version that is a promise
      # about a release nobody has cut.
      - name: Stamp the tag's version
        if: steps.changed.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -stamp "$RELEASE_VERSION"
          echo "publishing @skgo/sveltekit-adapter@${RELEASE_VERSION#v}"

      # npm binds this direct publish to the repository, this release.yml file,
      # and this GitHub-hosted runner through the trusted publisher configured
      # on the package. No static npm or Doppler credential reaches the runner.
      - name: npm publish
        if: steps.changed.outputs.publish == 'true'
        working-directory: internal/adapter
        run: npm publish --access public

  sv-package:
    name: Prepare @skgo/sv on Bob
    needs: source
    if: needs.source.outputs.version != ''
    runs-on: [self-hosted, Linux, X64, skgo-release]
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.changed.outputs.publish }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true
      - name: Install the add-on's build-only dependencies
        working-directory: internal/sv
        run: vp install --frozen-lockfile
      - name: Build the add-on once
        working-directory: internal/sv
        run: vp run build
      - name: Check the self-contained add-on
        run: go test ./internal/sv/
      - name: Is the package any different from the published one?
        id: changed
        run: |
          result=$(go run ./cmd/skgo-adapter-changed -dir internal/sv -package @skgo/sv -require-published)
          case "$result" in
            changed) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            unchanged) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "skgo-adapter-changed answered '$result'"; exit 1 ;;
          esac
      - name: Stamp and pack the candidate
        if: steps.changed.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          go run ./cmd/skgo-adapter-changed -dir internal/sv -package @skgo/sv -stamp "$RELEASE_VERSION"
          mkdir -p "$RUNNER_TEMP/sv-package"
          cd internal/sv
          vp pm pack --pack-destination "$RUNNER_TEMP/sv-package"
      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.publish == 'true'
        with:
          name: sv-package
          path: ${{ runner.temp }}/sv-package/*.tgz
          if-no-files-found: error
          retention-days: 2

  sv-npm:
    name: Publish @skgo/sv
    needs: [source, linux-cli, macos-cli, sv-package]
    if: needs.sv-package.outputs.publish == 'true'
    # npm's trusted publisher requires this hosted workflow identity. Consume
    # Bob's exact stamped tarball; no build or dependency install happens here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: sv-package
          path: sv-package
      - name: Publish the missing npm package or confirm the existing bytes
        run: |
          tarball=$(find sv-package -name '*.tgz' -print -quit)
          package=$(tar -xOf "$tarball" package/package.json | jq -r .name)
          version=$(tar -xOf "$tarball" package/package.json | jq -r .version)
          TARBALL="$tarball" PACKAGE="$package" VERSION="$version" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const {TARBALL,PACKAGE,VERSION}=process.env;
          const response=await fetch(`https://registry.npmjs.org/${encodeURIComponent(PACKAGE)}/${VERSION}`);
          if(response.status===404){execFileSync('npm',['publish',TARBALL,'--access','public'],{stdio:'inherit'});}
          else {
            if(!response.ok)throw new Error(`Registry returned ${response.status}`);
            const existing=await response.json();
            const integrity='sha512-'+createHash('sha512').update(readFileSync(TARBALL)).digest('base64');
            if(existing.dist.integrity!==integrity)throw new Error('Published package differs from the retained release tarball');
            console.log(`${PACKAGE}@${VERSION} is already published`);
          }
          NODE


  publish:
    name: Publish GitHub Release and Homebrew cask
    needs: [source, linux-cli, macos-cli, adapter-npm, sv-package, sv-npm]
    if: ${{ !cancelled() && needs.source.outputs.version != '' && needs.linux-cli.result == 'success' && needs.macos-cli.result == 'success' && needs.adapter-npm.result == 'success' && (needs.sv-npm.result == 'success' || needs.sv-npm.result == 'skipped') && needs.sv-package.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, skgo-release]
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.candidate }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Reuse CLI archives already published for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
            for archive in dist/*.tar.gz; do
              if grep -Fxq "${archive##*/}" <<< "$existing"; then
                gh release download "$VERSION" --pattern "${archive##*/}" --dir dist --clobber
              fi
            done
          fi
      - name: Verify all archives and calculate final checksums
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: go run ./cmd/skgo-release checksums dist "$VERSION"
      - name: Publish the qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
            for archive in dist/*.tar.gz; do
              if ! grep -Fxq "${archive##*/}" <<< "$existing"; then gh release upload "$VERSION" "$archive"; fi
            done
            gh release upload "$VERSION" --clobber dist/checksums.txt
          else
            gh release create "$VERSION" --verify-tag --latest --title "SKGO $VERSION" --generate-notes dist/*.tar.gz dist/checksums.txt
          fi
      - name: Fetch Homebrew publisher from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = skgo && test "$CONFIG" = stg
      - uses: actions/checkout@v7
        with:
          repository: tylergannon/homebrew-skgo
          ref: main
          path: homebrew-tap
          ssh-key: ${{ steps.doppler.outputs.TAP_DEPLOY_KEY }}
      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: go run ./cmd/skgo-release tap homebrew-tap "$VERSION"

  receipt:
    name: Report publication and request installation observation
    needs: [source, publish]
    if: always() && needs.source.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Record this publication result
        env:
          STATUS_WRITE_TOKEN: ${{ secrets.STATUS_WRITE_TOKEN }}
          CANDIDATE: ${{ needs.source.outputs.candidate }}
          ATTEMPT: ${{ needs.source.outputs.attempt }}
          VERSION: ${{ needs.source.outputs.version }}
          RESULT: ${{ needs.publish.result }}
        run: |
          id="release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "PUBLICATION=$id" >> "$GITHUB_ENV"
          state=failed
          if test "$RESULT" = success; then state=published; fi
          for outcome in requested "$state"; do
            jq -n --arg id "$id" --arg attempt "$ATTEMPT" --arg sha "$CANDIDATE" --arg tag "$VERSION" --arg state "$outcome" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{id:$id,attempt:$attempt,candidate:$sha,tag:$tag,state:$state,run:$run}' > publication.json
            curl --fail --silent --show-error -H "Authorization: Bearer $STATUS_WRITE_TOKEN" -H 'Content-Type: application/json' --data-binary @publication.json https://skgo-site.fly.dev/api/core-publications
          done
      - name: Request actual published-channel confirmation
        if: needs.publish.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.SKGO_PROJECT_DISPATCH_TOKEN }}
          CANDIDATE: ${{ needs.source.outputs.candidate }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          jq -n --arg sha "$CANDIDATE" --arg tag "$VERSION" --arg publication "$PUBLICATION" '{event_type:"skgo-core-published",client_payload:{sha:$sha,tag:$tag,publication:$publication}}' > installation-request.json
          gh api repos/tylergannon/skgo-project/dispatches --input installation-request.json
