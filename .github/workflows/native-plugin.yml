name: Native plugin release

# Core publication schedules a candidate. Only explicit qualification publishes it.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      core_version:
        description: Exact already-published official skgo version (vX.Y.Z)
        required: true
        type: string
      plugin_version:
        description: Independent native-shell version (blank reserves the next patch)
        required: false
        type: string
  repository_dispatch:
    types: [native-plugin-qualified]

# Serialize version reservations and publication; never replace an active request.
concurrency:
  group: native-plugin-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  NATIVE_RELEASE_DISPATCH_REPOSITORY: ${{ secrets.NATIVE_RELEASE_DISPATCH_REPOSITORY }}
  NATIVE_RELEASE_DISPATCH_TOKEN: ${{ secrets.NATIVE_RELEASE_DISPATCH_TOKEN }}

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: skgo-managed-macos
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      published: ${{ steps.prepare.outputs.published }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Resolve official core identity and reserve or reuse the candidate
        id: prepare
        run: go run ./cmd/skgo-native-release prepare
      - uses: jdx/mise-action@v4
        if: steps.prepare.outputs.reuse != 'true' && steps.prepare.outputs.published != 'true'
        with:
          working_directory: plugins/native-shell/sdk
          export_path: true
          cache: false
      - name: Native module, generated Swift, static SDK and shared-core regression tests
        if: steps.prepare.outputs.reuse != 'true' && steps.prepare.outputs.published != 'true'
        run: go test -tags skgo_qualification -count=1 ./plugins/native-shell/... ./plugins/native-client/...
      - name: Fetch the official executable and build against its identity
        if: steps.prepare.outputs.reuse != 'true' && steps.prepare.outputs.published != 'true'
        env:
          CORE_VERSION: ${{ steps.prepare.outputs.core_version }}
          CORE_SOURCE_SHA: ${{ steps.prepare.outputs.core_source_sha }}
          PLUGIN_VERSION: ${{ steps.prepare.outputs.plugin_version }}
        run: |
          test "$(uname -m)" = arm64
          mkdir -p official candidate
          archive="skgo_${CORE_VERSION#v}_darwin_arm64.tar.gz"
          gh release download "$CORE_VERSION" --pattern "$archive" --pattern checksums.txt --dir official
          expected=$(awk -v archive="$archive" '$2 == archive { print $1 }' official/checksums.txt)
          test "${#expected}" = 64
          echo "$expected  official/$archive" | shasum -a 256 --check
          tar -xzf "official/$archive" -C official
          host=$(find "$PWD/official" -type f -name skgo -print -quit)
          test -n "$host"
          "$host" buildinfo --json > official/buildinfo.json
          test "$(jq -r .skgoVersion official/buildinfo.json)" = "$CORE_VERSION"
          artifact="native-shell-${PLUGIN_VERSION}-skgo-${CORE_VERSION}-darwin-arm64.so"
          go run ./cmd/skgo-plugin-build --host "$host" --source plugins/native-shell --out "candidate/$artifact" --version-symbol main.SkgoVersion --plugin-version "$PLUGIN_VERSION"
          go run ./cmd/skgo-native-release record
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.reuse != 'true' && steps.prepare.outputs.published != 'true'
        with:
          name: native-shell-candidate-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 30

  notify:
    needs: candidate
    if: needs.candidate.outputs.published != 'true'
    runs-on: skgo-managed-linux
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Deliver the immutable candidate to configured qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/skgo-native-release notify

  publish:
    if: github.event_name == 'repository_dispatch'
    runs-on: skgo-managed-linux
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Verify qualification identity, publish original bytes and notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/skgo-native-release promote
