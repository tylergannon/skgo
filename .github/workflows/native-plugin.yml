name: Native plugin release

# Deliberately independent of pushes, the core version, and core qualification.
# NATIVE_GATE_TOKEN can dispatch and read Actions in private skgo-project.
on:
  workflow_dispatch:
    inputs:
      core_version:
        description: Exact already-published official skgo version (vX.Y.Z)
        required: true
        type: string
      plugin_version:
        description: Independent native-shell release version (vX.Y.Z)
        required: true
        type: string
  repository_dispatch:
    types: [native-plugin-qualified]

concurrency:
  group: native-plugin-release-${{ github.event.inputs.plugin_version || github.event.client_payload.plugin_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, skgo-release, amritanandamayi]
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: jdx/mise-action@v4
        with:
          working_directory: plugins/native-shell/sdk
          export_path: true
          cache: false
      - name: Native module, generated Swift and SDK regression tests
        working-directory: plugins/native-shell
        env:
          GOWORK: 'off'
        run: go test -tags skgo_qualification -count=1 ./...
      - name: Zig SDK unit tests and Swift link library
        working-directory: plugins/native-shell/sdk/core
        run: mise exec -- zig build -j4 test library
      - name: Swift SDK unit tests
        working-directory: plugins/native-shell/sdk/swift
        run: swift test --jobs 4
      - name: Fetch the official executable and build against its identity
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_VERSION: ${{ inputs.core_version }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          [[ "$CORE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PLUGIN_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          mkdir -p official candidate
          archive="skgo_${CORE_VERSION#v}_darwin_arm64.tar.gz"
          gh release download "$CORE_VERSION" --pattern "$archive" --pattern checksums.txt --dir official
          (cd official && shasum -a 256 --check --ignore-missing checksums.txt)
          tar -xzf "official/$archive" -C official
          host=$(find "$PWD/official" -type f -name skgo | head -1)
          test -n "$host"
          "$host" buildinfo --json > official/buildinfo.json
          test "$(jq -r .skgoVersion official/buildinfo.json)" = "$CORE_VERSION"
          artifact="native-shell-${PLUGIN_VERSION}-skgo-${CORE_VERSION}-darwin-arm64.so"
          go run ./cmd/skgo-plugin-build --host "$host" --source plugins/native-shell --out "candidate/$artifact" --version-symbol main.SkgoVersion --plugin-version "$PLUGIN_VERSION"
          (cd candidate && shasum -a 256 "$artifact" > checksums.txt)
          echo "sha256=$(shasum -a 256 "candidate/$artifact" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: native-shell-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
      - name: Request the private tiny-application gate
        env:
          GH_TOKEN: ${{ secrets.NATIVE_GATE_TOKEN }}
          CORE_VERSION: ${{ inputs.core_version }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          gh workflow run native-plugin-gate.yml --repo tylergannon/skgo-project --ref main \
            -f candidate_run="$GITHUB_RUN_ID" -f candidate_sha256="$CANDIDATE_SHA256" \
            -f plugin_version="$PLUGIN_VERSION" -f core_version="$CORE_VERSION" -f source_sha="$SOURCE_SHA"

  publish:
    # The private gate supplies its successful run, the source candidate run,
    # and the digest it actually exercised. Neither a merge nor candidate build
    # can authorize this job. This job never recompiles the plugin.
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, Linux, X64, skgo-release, bob]
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate the private gate's authorization
        id: authorized
        env:
          GH_TOKEN: ${{ secrets.NATIVE_GATE_TOKEN }}
          GATE_RUN: ${{ github.event.client_payload.gate_run }}
          CANDIDATE_RUN: ${{ github.event.client_payload.candidate_run }}
          CANDIDATE_SHA256: ${{ github.event.client_payload.candidate_sha256 }}
          PLUGIN_VERSION: ${{ github.event.client_payload.plugin_version }}
          CORE_VERSION: ${{ github.event.client_payload.core_version }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          [[ "$GATE_RUN" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLUGIN_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CORE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/tylergannon/skgo-project/actions/runs/$GATE_RUN" > gate.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/native-plugin-gate.yml" and .head_branch == "main" and .event == "workflow_dispatch"' gate.json
          gh run download "$GATE_RUN" --repo tylergannon/skgo-project --name native-plugin-authorization --dir authorization
          jq -e --arg candidate "$CANDIDATE_RUN" --arg sha "$CANDIDATE_SHA256" --arg plugin "$PLUGIN_VERSION" --arg core "$CORE_VERSION" --arg source "$SOURCE_SHA" \
            '(.candidate_run | tostring) == $candidate and .candidate_sha256 == $sha and .plugin_version == $plugin and .core_version == $core and .source_sha == $source' \
            authorization/native-plugin-authorization.json
          echo "artifact=native-shell-${PLUGIN_VERSION}-skgo-${CORE_VERSION}-darwin-arm64.so" >> "$GITHUB_OUTPUT"
      - name: Validate the source candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.client_payload.candidate_run }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate.json
          jq -e --arg source "$SOURCE_SHA" '.conclusion == "success" and .path == ".github/workflows/native-plugin.yml" and .event == "workflow_dispatch" and .head_sha == $source' candidate.json
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.candidate_run }}
          name: native-shell-candidate
          path: candidate
      - name: Publish only the qualified bytes, outside core's latest channel
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.authorized.outputs.artifact }}
          CANDIDATE_SHA256: ${{ github.event.client_payload.candidate_sha256 }}
          PLUGIN_VERSION: ${{ github.event.client_payload.plugin_version }}
          CORE_VERSION: ${{ github.event.client_payload.core_version }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          GATE_RUN: ${{ github.event.client_payload.gate_run }}
        run: |
          echo "$CANDIDATE_SHA256  candidate/$ARTIFACT" | sha256sum --check
          (cd candidate && sha256sum --check checksums.txt)
          tag="plugins/native-shell/$PLUGIN_VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Native release tag already exists; release identities are immutable." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest=false \
            --title "native-shell $PLUGIN_VERSION for skgo $CORE_VERSION" \
            --notes "Exact official host: skgo $CORE_VERSION, macOS ARM64. Qualified by tylergannon/skgo-project Actions run $GATE_RUN." \
            "candidate/$ARTIFACT" candidate/checksums.txt
          mkdir downloaded
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT" --dir downloaded
          echo "$CANDIDATE_SHA256  downloaded/$ARTIFACT" | sha256sum --check
