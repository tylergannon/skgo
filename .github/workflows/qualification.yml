name: Release qualification

on:
  workflow_call:
    inputs:
      native:
        type: boolean
        default: true
      production:
        type: boolean
        default: true
      development:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

# This workflow qualifies production. The replacement dev server has focused
# checks; a complete development browser-suite pass is not established.
jobs:
  qualification:
    name: Example BDD (production)
    if: github.event_name == 'workflow_dispatch' || inputs.production
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","skgo-release"]') }}
    timeout-minutes: 45
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ORIGIN: http://127.0.0.1:8080
      SKGO_PORT: "8080"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: ${{ github.event_name == 'pull_request' }}

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          # Generation changes directories. Export the pinned executables;
          # a mise shim cannot resolve example's Node pin from the repo root.
          export_path: true


      - uses: extractions/setup-just@v4

      - name: Install the example and browser
        run: |
          just install
          mise -C example/e2e exec -- vp exec playwright install --with-deps chromium

      - name: Build the candidate
        run: just build

      - name: Built-example handler contracts
        run: go test -tags skgo_qualification -count=1 ./example/...

      - name: Example BDD against the production build
        run: |
          bound=$(lsof -t -i tcp:"$SKGO_PORT" 2>/dev/null || true)
          if [ -n "$bound" ]; then
            echo "::error title=Port already bound::pid(s) $bound already listen on the qualification ports."
            exit 1
          fi
          just serve &
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$ORIGIN/" && break
            sleep 1
          done
          mode=$(curl -sI "$ORIGIN/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-skgo-mode"{print $2}')
          if [ "$mode" != "prod" ]; then
            echo "::error title=Wrong handler::Expected prod, got '${mode:-<absent>}'."
            exit 1
          fi
          just e2e prod

      - name: Stop qualification servers
        if: always()
        run: |
          pids=$(lsof -t -i tcp:"$SKGO_PORT" 2>/dev/null || true)
          [ -n "$pids" ] || exit 0
          kill $pids 2>/dev/null || true
          sleep 3
          pids=$(lsof -t -i tcp:"$SKGO_PORT" 2>/dev/null || true)
          [ -n "$pids" ] && kill -9 $pids 2>/dev/null || true

      # A green run leaves nothing to look at. A red one leaves Playwright's
      # own trace and screenshot of each failed scenario, its HTML report, and
      # what the server logged while it ran.
      - name: Keep the failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-prod-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            example/e2e/test-results/
            example/e2e/playwright-report/
            example/e2e/server.log

  native-linux:
    name: Generated consumers and native replacement (Linux)
    if: github.event_name == 'workflow_dispatch' || inputs.native
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","skgo-release"]') }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: ${{ github.event_name == 'pull_request' }}
      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true
      - run: cd example/web && vp install --frozen-lockfile
      - name: Preserve Zig compiler caches across checkout cleanup
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/skgo-zig-local" >> "$GITHUB_ENV"
      - run: mise -C native install zig
      - name: Fresh compiler and process witnesses
        run: go test -tags skgo_qualification -count=1 ./internal/gen ./internal/hotreload ./native -run '^(TestTypedLoadActualParameterDependencies|TestGeneratedLanguageApplications|TestGenerationCacheFreshProcessesAndRecovery|TestATypeFromAnotherModuleCrossesTheWire|TestRetainedProjectSelectedCompilerInputs|TestGeneratedNativeHandlerContract|TestGeneratedNativeLifetime|TestCapturedNativeHTTPHost|TestZigRemoteCalls)$'
      - name: Production chunk fold and prerender ownership
        run: go test -tags skgo_qualification -count=1 ./internal/adapter -run '^(TestProductionFoldResolvesSharedTransitiveRemoteOutsideAppTSConfig|TestPrerenderFailedDrainRetainsOwnerAndCanRecover|TestPrerenderInterruptedFailedDrainExitsWithOriginalSignal)$' -v

  native-macos:
    name: Native replacement and Swift consumer (macOS)
    if: github.event_name == 'workflow_dispatch' || inputs.native
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-15"]' || '["self-hosted","macOS","ARM64","skgo-release"]') }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: ${{ github.event_name == 'pull_request' }}
      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true
      - run: cd example/web && vp install --frozen-lockfile
      - name: Preserve Zig compiler caches across checkout cleanup
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/skgo-zig-local" >> "$GITHUB_ENV"
      - run: mise -C native install zig
      - name: Fresh native host, Zig exchange and Swift compiler witnesses
        run: go test -tags skgo_qualification -count=1 ./internal/hotreload ./internal/swiftgen ./native -run '^(TestGeneratedNativeHandlerContract|TestGeneratedNativeLifetime|TestCapturedNativeHTTPHost|TestGeneratedModelsCompileAndEnforceTheWireShape|TestZigRemoteCalls)$'
      - name: Native Darwin prerender process ownership
        run: go test -tags skgo_qualification -count=1 ./internal/adapter -run '^(TestPrerenderFailureWaitsForNativeExitedGroupReap|TestPrerenderFailedDrainRetainsOwnerAndCanRecover|TestPrerenderInterruptedFailedDrainExitsWithOriginalSignal)$' -v

  development:
    name: Vite and Go session boundary
    if: github.event_name == 'workflow_dispatch' || inputs.development
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","skgo-release"]') }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: ${{ github.event_name == 'pull_request' }}
      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: true
      - run: cd example/web && vp install --frozen-lockfile
      - name: Fresh application generation and recovery witnesses
        run: go test -tags skgo_dev_integration -count=1 ./internal/devserver -run '^TestRealSession(NativeRecoveryAndIsolation|ApplicationGeneration)$' -v
