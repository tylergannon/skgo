name: Release qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Fresh application and example BDD
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ORIGIN: http://127.0.0.1:8080
      SKGO_PORT: "8080"
      SKGO_DEV_PORT: "5173"
      SKGO_QUALIFICATION_ARTIFACTS: ${{ github.workspace }}/qualification-artifacts
      # The full suite still asserts every scenario. Release evidence is a
      # deliberately small visual sample: two example frames plus the fresh
      # generated application's eight prod/dev outcome frames.
      SKGO_E2E_SCREENSHOTS: curated

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum
            example/go.sum

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: extractions/setup-just@v4

      - name: Install the example and browser
        run: |
          just install
          cd example/e2e
          pnpm exec playwright install --with-deps chromium

      - name: Build and test the candidate
        run: |
          just build
          just vet
          just test

      # This publishes the checkout to an isolated Go module proxy, packs the
      # candidate adapter, generates a new application, and lets that generated
      # application's own BDD contract drive fresh prod and dev processes.
      - name: A fresh generated application works in prod and dev
        run: go test -tags=qualification -count=1 -timeout=30m -v ./internal/newapp -run '^TestGeneratedProjectBrowserContract$'

      - name: Example BDD against the production build
        id: example_prod
        run: |
          bound=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          if [ -n "$bound" ]; then
            echo "::error title=Port already bound::pid(s) $bound already listen on the qualification ports."
            exit 1
          fi
          just serve &
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$ORIGIN/" && break
            sleep 1
          done
          mode=$(curl -sI "$ORIGIN/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-skgo-mode"{print $2}')
          if [ "$mode" != "prod" ]; then
            echo "::error title=Wrong handler::Expected prod, got '${mode:-<absent>}'."
            exit 1
          fi
          result=0
          just e2e prod || result=$?
          pids=$(lsof -t -i tcp:"$SKGO_PORT" 2>/dev/null || true)
          [ -n "$pids" ] && kill $pids 2>/dev/null || true
          exit $result

      # The example owns the richer development claims, including editing an
      # already-open page and proving it hot-updates without a document reload.
      - name: Example BDD against development, including HMR
        if: ${{ !cancelled() && steps.example_prod.outcome != 'skipped' }}
        run: |
          just dev &
          for _ in $(seq 120); do
            curl -sf -o /dev/null "http://127.0.0.1:$SKGO_DEV_PORT/__skgo_dev/info" && break
            sleep 1
          done
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$ORIGIN/" && break
            sleep 1
          done
          mode=$(curl -sI "$ORIGIN/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-skgo-mode"{print $2}')
          if [ "$mode" != "dev" ]; then
            echo "::error title=Wrong handler::Expected dev, got '${mode:-<absent>}'."
            exit 1
          fi
          just e2e dev

      - name: Stop qualification servers
        if: always()
        run: |
          pids=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          [ -n "$pids" ] || exit 0
          kill $pids 2>/dev/null || true
          sleep 3
          pids=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          [ -n "$pids" ] && kill -9 $pids 2>/dev/null || true

      - name: Preserve ten inspectable release frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            qualification-artifacts/generated/screenshots/prod/*.png
            qualification-artifacts/generated/screenshots/dev/*.png
            ephemeral/screenshots/zz-source-update/prod/*-built-unchanged.png
            ephemeral/screenshots/zz-source-update/dev/*-hot-updated.png
