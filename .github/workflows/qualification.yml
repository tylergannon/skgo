name: Release qualification

on:
  workflow_call:
    inputs:
      native:
        type: boolean
        default: true
      production:
        type: boolean
        default: true
      development:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

# Tagged Go tests that need a built example, a compiler, a native process or a
# real development session. One browser check, Kit's client adopting the page
# Go rendered, runs from a Go test in the production and development jobs.
jobs:
  qualification:
    name: Built example and client handoff (production)
    if: github.event_name == 'workflow_dispatch' || inputs.production
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 45
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # TestBuiltClientHandoff serves the build on the origin Kit baked in.
      ORIGIN: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - &mise
        uses: jdx/mise-action@v4
        with:
          working_directory: example
          # Generation changes directories. Export the pinned executables;
          # a mise shim cannot resolve example's Node pin from the repo root.
          export_path: true
          # Self-hosted runners keep their tools. Restoring the cache there
          # downloads hundreds of megabytes they already have.
          cache: false

      - uses: extractions/setup-just@v4

      - name: Install the example
        run: just install

      # The client handoff check drives Lightpanda, a headless browser without
      # layout or rendering. The bob runner image carries the pinned release;
      # elsewhere the script downloads it by digest.
      - &lightpanda
        name: Lightpanda
        run: scripts/ci/install-lightpanda.sh "$RUNNER_TEMP/lightpanda"

      - name: Build the candidate
        run: just build

      - name: Svelte type check of the built example
        run: cd example/web && vp run check

      - name: Install pinned Go checker tools
        run: |
          just tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Check the unmodified built example
        run: go test -tags skgo_qualification -count=1 ./cmd/skgo -run '^TestCheckPassesOnTheUnmodifiedExample$' -v

      - name: Built-example handlers and client handoff
        run: go test -tags skgo_qualification -count=1 ./example/...

      # A green run leaves nothing to look at. A red client-handoff run leaves
      # the page's HTML at the failure.
      - name: Keep the failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-prod-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: example/web/test-results/

  compiler-linux:
    name: Generated consumers and Go process boundaries (Linux)
    if: github.event_name == 'workflow_dispatch' || inputs.native
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - *mise
      - run: cd example/web && vp install --frozen-lockfile
      - name: Fresh compiler and process witnesses
        run: go test -tags skgo_qualification -count=1 ./internal/gen ./internal/hotreload -run '^(TestTypedLoadActualParameterDependencies|TestGeneratedLanguageApplications|TestGenerationCacheFreshProcessesAndRecovery|TestATypeFromAnotherModuleCrossesTheWire|TestRetainedProjectSelectedCompilerInputs|TestAMigratedLinkTreeCompilesRouteEmbeds|TestGeneratedNativeHandlerContract|TestGeneratedNativeLifetime|TestCapturedNativeHTTPHost)$'
      - name: Independent generator and command fixture on the real CLI
        run: go test -tags skgo_qualification -count=1 ./cmd/skgo -run '^TestCapabilityPluginActualCLI$'
      - name: Production chunk fold and prerender ownership
        run: go test -tags skgo_qualification -count=1 ./internal/adapter -run '^(TestProductionFoldResolvesSharedTransitiveRemoteOutsideAppTSConfig|TestPrerenderFailedDrainRetainsOwnerAndCanRecover|TestPrerenderInterruptedFailedDrainExitsWithOriginalSignal)$' -v

  compiler-macos:
    name: Go process boundaries (macOS)
    if: github.event_name == 'workflow_dispatch' || inputs.native
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-26' || 'skgo-managed-macos' }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - *mise
      - run: cd example/web && vp install --frozen-lockfile
      - name: Fresh Go host process witnesses
        run: go test -tags skgo_qualification -count=1 ./internal/hotreload -run '^(TestGeneratedNativeHandlerContract|TestGeneratedNativeLifetime|TestCapturedNativeHTTPHost)$'
      - name: Native Darwin prerender process ownership
        run: go test -tags skgo_qualification -count=1 ./internal/adapter -run '^(TestPrerenderFailureWaitsForNativeExitedGroupReap|TestPrerenderFailedDrainRetainsOwnerAndCanRecover|TestPrerenderInterruptedFailedDrainExitsWithOriginalSignal)$' -v

  development:
    name: Vite and Go session boundary
    if: github.event_name == 'workflow_dispatch' || inputs.development
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - *mise
      - name: Install the example
        run: cd example/web && vp install --frozen-lockfile
      - *lightpanda
      - name: Fresh application generation, recovery and client handoff
        shell: bash
        run: go test -tags skgo_dev_integration -count=1 ./internal/devserver -run '^TestRealSession(NativeRecoveryAndIsolation|ApplicationGeneration|RouteEmbed|RouteEditDuringPendingLoad|ClientHandoff)$' -v 2>&1 | tee development-session.log
      # The session log is in the test output; a failed client-handoff run
      # keeps the page's HTML.
      - name: Keep the failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-dev-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            development-session.log
            example/web/test-results/
