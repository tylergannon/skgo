name: Release qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ORIGIN: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum
            example/go.sum

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.1

      - uses: extractions/setup-just@v4

      - name: Build, vet, and test Go
        run: |
          just install
          just build
          just vet
          just test

  qualification:
    name: Example BDD (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [prod, dev]
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ORIGIN: http://127.0.0.1:8080
      SKGO_PORT: "8080"
      SKGO_DEV_PORT: "5173"
      SKGO_E2E_SCREENSHOTS: all

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum
            example/go.sum

      - uses: jdx/mise-action@v4
        with:
          working_directory: example
          export_path: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.1

      - uses: extractions/setup-just@v4

      - name: Install the example and browser
        run: |
          just install
          cd example/e2e
          pnpm exec playwright install --with-deps chromium

      - name: Build the candidate
        run: just build

      - name: Example BDD against ${{ matrix.mode }}
        run: |
          bound=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          if [ -n "$bound" ]; then
            echo "::error title=Port already bound::pid(s) $bound already listen on the qualification ports."
            exit 1
          fi
          if [ "${{ matrix.mode }}" = dev ]; then
            just dev &
            for _ in $(seq 120); do
              curl -sf -o /dev/null "http://127.0.0.1:$SKGO_DEV_PORT/__skgo_dev/info" && break
              sleep 1
            done
          else
            just serve &
          fi
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$ORIGIN/" && break
            sleep 1
          done
          mode=$(curl -sI "$ORIGIN/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-skgo-mode"{print $2}')
          if [ "$mode" != "${{ matrix.mode }}" ]; then
            echo "::error title=Wrong handler::Expected ${{ matrix.mode }}, got '${mode:-<absent>}'."
            exit 1
          fi
          just e2e "${{ matrix.mode }}"

      - name: Stop qualification servers
        if: always()
        run: |
          pids=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          [ -n "$pids" ] || exit 0
          kill $pids 2>/dev/null || true
          sleep 3
          pids=$(lsof -t -i tcp:"$SKGO_PORT" -i tcp:"$SKGO_DEV_PORT" 2>/dev/null || true)
          [ -n "$pids" ] && kill -9 $pids 2>/dev/null || true

      - name: Preserve scenario screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-${{ github.sha }}-${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ephemeral/screenshots/**
            example/e2e/test-results/**
