name: MCP plugin unit tests
on:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
    paths:
      - 'plugins/mcp/**'
      - 'templateapi/**'
      - 'internal/gen/**'
      - 'remoteprotocol/**'
      - 'internal/remotearg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mcp-plugin-tests.yml'
  pull_request:
    paths:
      - 'plugins/mcp/**'
      - 'templateapi/**'
      - 'internal/gen/**'
      - 'remoteprotocol/**'
      - 'internal/remotearg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mcp-plugin-tests.yml'
permissions:
  contents: read
jobs:
  units:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/mcp/go.mod
          cache-dependency-path: plugins/mcp/go.sum
      - name: Generator, JSON and HTTP transport unit tests
        working-directory: plugins/mcp
        env:
          GOWORK: 'off'
        run: go test ./...
