name: CLI plugin unit tests
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
    paths:
      - 'plugins/cli/**'
      - 'templateapi/**'
      - 'internal/gen/**'
      - 'remoteprotocol/**'
      - 'internal/remotearg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cli-plugin-tests.yml'
  pull_request:
    paths:
      - 'plugins/cli/**'
      - 'templateapi/**'
      - 'internal/gen/**'
      - 'remoteprotocol/**'
      - 'internal/remotearg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cli-plugin-tests.yml'
permissions:
  contents: read
jobs:
  units:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'skgo-managed-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
          cache-dependency-path: plugins/cli/go.sum
      - name: Generator, JSON and HTTP transport unit tests
        working-directory: plugins/cli
        run: go test ./...
