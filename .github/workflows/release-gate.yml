name: Release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualification:
    name: Fresh-application qualification
    uses: ./.github/workflows/qualification.yml

  promote:
    name: Tag the qualified commit
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Derive the release from Conventional Commits
        id: version
        run: |
          version=$(go run ./cmd/skgo-release-version)
          if [ "$version" = "none" ]; then
            echo "No feat, fix, perf, revert, or breaking commit since the last release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag the exact qualified SHA
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" "$GITHUB_SHA" -m "$VERSION"
          git push origin "$VERSION"

  publish:
    name: Publish the qualified release
    needs: promote
    if: needs.promote.outputs.version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.promote.outputs.version }}
    permissions:
      contents: read
      id-token: write
