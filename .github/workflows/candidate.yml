name: Announce core candidate
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  announce:
    runs-on: [self-hosted, Linux, X64, skgo-release, bob]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect core changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qv '^plugins/'; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Announce exact candidate without waiting for qualification
        if: steps.changes.outputs.core == 'true'
        env:
          GH_TOKEN: ${{ secrets.SKGO_PROJECT_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          jq -n --arg sha "$GITHUB_SHA" '{event_type:"skgo-core-candidate",client_payload:{sha:$sha}}' > "$RUNNER_TEMP/candidate.json"
          gh api repos/tylergannon/skgo-project/dispatches --input "$RUNNER_TEMP/candidate.json"
