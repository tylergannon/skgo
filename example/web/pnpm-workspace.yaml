# esbuild is nothing this app imports any more — the engine's bundle is built
# by kit's own vite build — but pnpm still installs it, as an optional
# transitive dependency of @voidzero-dev/vite-plus-core, and refuses to finish
# an install that leaves a build script unanswered. Its install script only
# fetches or checks a platform binary nothing runs, so the answer is no.
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - "@types/node@24.19.2"
  - "@sveltejs/kit@3.1.0"
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - svelte-check@4.7.7
  - vite-plus@1.3.0

# VitePlus 1.3.0 manages its compatible Vite runtime under a package whose own version is 1.3.0.
# Its migration overrides peer Vite edges to the same core; allow only this
# exact alias version here, so future core upgrades need a new compatibility check.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.3.0"
patchedDependencies:
  "@sveltejs/kit@3.1.0": patches/skgo-kit-3.1.0-queue.patch
peerDependencyRules:
  allowedVersions:
    vite: "1.3.0"
