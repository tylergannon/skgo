name: SKGoNativeProbe
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
targets:
  SKGoNative:
    type: library.static
    platform: iOS
    sources:
      - path: ../../native/swift/Sources/SKGoNative
    settings:
      base:
        PRODUCT_MODULE_NAME: SKGoNative
        SWIFT_VERSION: '6.0'
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../core
  SKGoNativeProbe:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylergannon.skgo.nativeprobe
        SWIFT_VERSION: '6.0'
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../../ios/Bridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../host
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../core
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/../host/skgo-host.a
          - $(SRCROOT)/../core/lib/libskgo_native_core.a
        INFOPLIST_FILE: $(SRCROOT)/../../../ios/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - target: SKGoNative
schemes:
  SKGoNativeProbe:
    build:
      targets:
        SKGoNativeProbe: all
