      build: a fourth Vite environment of kit's build, emitted as ordinary
      modules and folded once into a single script by a second rolldown call
      from adapt(), the polyfill in that fold's banner, per-module lowering
      of only the modules whose syntax goja lacks, and a `$app/server`
      substitute served as a virtual module to that environment only. Read
      the record's traps before you begin; two of them (the banner rule and
      kit's node numbering against skgo's manifest) cost a session each to
