      GitHub issue #61 is this mission.

      Kit as the specification: `$app/server`'s query module (live and
      batch), the server's live-query response, the client's live-query
      iterator and cache, and how kit hydrates remote data into the page.
      Remember the rule the client is protected by: what the server puts in
      the hydration payload is keyed the way the client keys its cache.

      The example app must show this to a visitor: a page rendered in Go with
      a live value already in the markup before any script runs, which then
      changes on the page when a command elsewhere changes the underlying
      data; and a page that batches queries during its render. The existing
      todos live count is a natural starting point but the showcase must be
      visible, not implied.

      Acceptance: scenarios that would fail if the live value were missing
      from the rendered document, if hydration refetched it, if an update
      failed to arrive, or if a batch during render broke; screenshots of
      the rendered document's state and of the state after an update; Go
