# Four missions in sequence, each ending in a squash-merged PR: close the two
# streaming gaps, make the example app show everything skgo does, then rebuild
# the adapter on kit's own build. A mission is built by one agent, judged by a
# fresh one that merges only what it has proved, and the walk moves on only
# when origin/main has actually advanced.
#
# Dispatched 2026-09-07 from the adapter research; the decision record is
# ephemeral/brief/2026-09-07-adapter-research-continuation.md.
name: streaming-showcase-adapter
goal: |
  You are working on skgo, a SvelteKit application server written in Go.
  AGENTS.md in the repository root governs this project; read it first and
  invoke the agent-protocol skill as it says. Kit is the specification, and
  the pinned kit source is at the absolute path
  /Users/tyler/src/skgo/ephemeral/inspiration/reference/kit (a link to
  kit@3.0.0-next.25 beside it), outside any worktree and reachable from
  anywhere. Svelte's source is in example/web/node_modules/svelte/src.

  Work in a task worktree made with `just worktree <branch>` from the root
  checkout /Users/tyler/src/skgo; `just --list` is the rest of the plumbing.
  Do the work yourself in this session. You may use subagents for reading
  and research, but never return while dispatched work is outstanding: your
  process ending kills it.

  What is believed: Gherkin scenarios in example/e2e against the running
  example app, with screenshots taken at the moment each scenario asserts,
  opened and looked at by you before you hand them to anyone. Each
  expectation is anchored in something independent of the code under test (a
  fixture, a number written in the scenario, rows visible on the page), never
  in a value read off the thing being tested. Go tests for the Go. A passing
  command is not evidence and there is no command that means done.

  The work ends as a pull request against main from your task branch, whose
  body is written to serve as the squash commit message, with the worklog
  entry appended (traps and corrections only, nothing that is visible in the
  diff). Write the PR URL to the state file the mission names, so the judge
  can find it. Stop every server you started before you finish. Do not merge
  the PR yourself; a judge in a fresh session does that.

  If the state file's `.findings.md` sibling exists, it is the judge's
  return from your previous attempt: address every finding on the same
  branch and PR, then remove the findings file.

start: sync_1

defaults:
  timeout: 14400s
  max_retries: 1
  fidelity: none
  model:
    name: claude-opus-5
    effort: high

nodes:
  # ---------------------------------------------------------------- mission 1
  - id: sync_1
    type: command
    command: >
      cd /Users/tyler/src/skgo && git fetch -q origin && git pull -q --ff-only
      && mkdir -p .tractor/state
      && git rev-parse origin/main > .tractor/state/mission-1.base
    edges:
      success: build_1
      error: failure

  - id: build_1
    type: agent
    max_visits: 3
    prompt: |
      $goal

      Mission 1, streaming the data a load promised, on both of kit's wires.
      State file: /Users/tyler/src/skgo/.tractor/state/mission-1.pr

      Capability when done: a Go developer's load can promise a value
      wherever kit's own client accepts a promise, and the value streams to
      the browser on the page document and on the `__data.json` response
      alike, in the order the promises settle, so a client-side navigation
      behaves exactly as a cold load does. A render error inside the
      JavaScript engine reaches Go's log; today it reaches nothing.

      Kit as the specification: its server data serializer and streaming
      helper, its `__data.json` handler, and its client's handling of
      deferred chunks. The Go rule today confines a Deferred to a top-level
      field of the load result and attributes that rule to kit; map kit 3's
      actual rule from source and follow kit, whichever way it goes. GitHub
      issue #57 records that the `__data.json` path yields chunks in id order
      rather than settlement order while the document path already mirrors
      kit; close it. The engine skgo renders in is goja, which lacks three
      globals kit's runtime assumes: Symbol.asyncIterator,
      Promise.withResolvers and console. Each runtime should have them from
      the moment it is created, with console reporting into Go so that a
      render error is finally logged where an operator will see it.

      The example app must show this to a visitor: a page whose load promises
      at least two values that settle out of order, with pending states that
      are visibly replaced, reached both by a cold load and by a client-side
      navigation from another page. If kit accepts a nested promise, one of
      the promised values is nested.

      Acceptance: scenarios in example/e2e that would fail if settlement
      order regressed, if a promised value never arrived on either wire, or
      if a render error went unlogged; screenshots of the pending and the
      settled states; Go tests of the wire. The existing suite stays green in
      both `just e2e` modes.

      Ownership: the Go load, data and document paths, the Deferred type and
      its generator checks, runtime creation in internal/ssr, the example
      app's routes and its e2e suite. Not yours: how the adapter builds the
      bundle (a later mission rebuilds it; touch skgo-adapter.js only where
      a deferred slot or the three globals require it, and run `just
      generate` as AGENTS.md says), and query.live or query.batch during a
      render (the next mission).
    edges:
      - to: validate_1

  - id: validate_1
    type: agent
    timeout: 7200s
    max_visits: 3
    prompt: |
      You are judging a pull request for skgo, a SvelteKit application server
      written in Go. AGENTS.md in /Users/tyler/src/skgo governs the project;
      read it first. The PR's URL is in
      /Users/tyler/src/skgo/.tractor/state/mission-1.pr. The pinned kit
      source, which is the specification, is at
      /Users/tyler/src/skgo/ephemeral/inspiration/reference/kit.

      The claim under judgement: a load's promised values stream to the
      browser on the page document and on `__data.json` in settlement order,
      wherever kit's client accepts a promise; a render error inside the
      engine reaches Go's log; goja runtimes carry Symbol.asyncIterator,
      Promise.withResolvers and console from creation; and the example app
      shows the streaming to a visitor. Issue #57 is closed by it.

      Do the judging yourself in this session; do not spawn agents. Check out
      the PR's branch in its own worktree, build and run the real app, and
      decide on evidence: whether each new scenario is load-bearing (break
      the behaviour it claims to protect and confirm the scenario fails),
      whether the whole suite passes in both modes against a server you
      started, whether every screenshot the suite produced shows the state
      the scenario claims when you open and look at it, whether the Go rule
      for where a Deferred may sit matches kit 3's source, and whether the
      PR is the software and nothing else (no ledgers, status documents or
      acceptance scripts; a worklog entry only for traps). Distrust the PR
      body; verify each claim by running it.

      If it holds, squash-merge the PR with `gh pr merge --squash
      --delete-branch`, fast-forward the root checkout
      /Users/tyler/src/skgo on main, remove the task worktree, and close #57
      if the merge did not. If it does not hold, write every finding with the
      evidence to
      /Users/tyler/src/skgo/.tractor/state/mission-1.findings.md and do not
      merge. If what stands in the way is a decision that is the project
      owner's to make rather than a defect, say so in the findings file and
      take that route. Stop every server you started.
    edges:
      - to: merged_1
        condition: The PR held up and has been squash-merged into main.
      - to: build_1
        condition: The PR has defects; findings were written for the builder.
      - to: failure
        condition: Something stands in the way that only the project owner can decide.

  - id: merged_1
    type: command
    command: >
      cd /Users/tyler/src/skgo && git fetch -q origin && git pull -q --ff-only
      && test "$(git rev-parse origin/main)" != "$(cat .tractor/state/mission-1.base)"
    edges:
      success: sync_2
      error: validate_1

