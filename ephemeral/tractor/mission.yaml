# Template for dispatching a skgo mission. Copy it, replace `goal`, run it.
#
# There is no acceptance node, and adding one would be a mistake. A command
# that exits 0 cannot see the software, but every agent that is shown one
# starts building toward it — which is how a project accumulates ten thousand
# lines and no working app. The run ends when the agent has produced
# screenshots of the running app; whether the work is done is decided by a
# human looking at them.
#
# The agent node is the builder. It may delegate, but it must not return while
# dispatched work is outstanding: its process ending kills its subagents, and
# a run that abandoned its work looks exactly like a run that finished.
name: skgo-mission
goal: |
  REPLACE ME with the capability a developer should have when this is done,
  kit as the specification and where the pinned source is, the scenarios that
  will be believed, the non-negotiable constraints, and what this run owns so
  parallel work does not collide. No file lists, no prescribed design.

  Create the worktree with `just worktree <branch>`; `just --list` is the rest
  of the plumbing. The pinned kit source — the specification — is at the
  absolute path /Users/tyler/src/skgo/ephemeral/inspiration/reference/kit, which
  is outside the worktree and reachable from anywhere. Read AGENTS.md first — it
  governs this project.

start: build

defaults:
  timeout: 3600s
  max_retries: 1
  model:
    name: claude-opus-5
    effort: high

nodes:
  - id: build
    type: agent
    max_visits: 1
    prompt: $goal
    edges:
      - to: success
